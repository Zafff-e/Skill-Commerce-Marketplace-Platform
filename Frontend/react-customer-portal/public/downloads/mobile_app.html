    function t(key) {
      return (dict[currentLang] && dict[currentLang][key]) ? dict[currentLang][key] : key;
    }

    function bnNum(num) {
      if (currentLang !== 'bn') return num.toString();
      const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().split('').map(c => {
        const code = c.charCodeAt(0);
        return (code >= 48 && code <= 57) ? bn[code - 48] : c;
      }).join('');
    }

    function toggleLang() {
      currentLang = currentLang === 'bn' ? 'en' : 'bn';
      document.getElementById('lang-btn-text').innerText = currentLang === 'bn' ? '🌐 বাংলা / EN' : '🌐 EN / বাংলা';
      updateTopRoleBanner();
      render();
    }

    // Voice Note Handling (Fix Issue 3)
    function toggleVoiceRecord() {
      if (!isVoiceRecording) {
        isVoiceRecording = true;
        voiceDuration = 0;
        hasVoiceRecorded = false;
        render();
        voiceTimer = setInterval(() => {
          voiceDuration++;
          if (voiceDuration >= 30) {
            toggleVoiceRecord();
          } else {
            const timerEl = document.getElementById('voice-record-timer');
            if (timerEl) {
              timerEl.innerText = bnNum(voiceDuration);
            }
          }
        }, 1000);
      } else {
        clearInterval(voiceTimer);
        isVoiceRecording = false;
        hasVoiceRecorded = true;
        render();
      }
    }

    function togglePlayVoice() {
      isVoicePlaying = !isVoicePlaying;
      render();
      if (isVoicePlaying) {
        clearTimeout(voicePlayTimer);
        voicePlayTimer = setTimeout(() => {
          isVoicePlaying = false;
          render();
        }, 3000);
      }
    }

    function clearVoiceNote() {
      clearInterval(voiceTimer);
      clearTimeout(voicePlayTimer);
      isVoiceRecording = false;
      hasVoiceRecorded = false;
      isVoicePlaying = false;
      voiceDuration = 0;
      render();
    }

    function openBookingModal() {

      const modal = document.getElementById('booking-modal');
      if (modal) modal.classList.add('hidden');
    }

    function confirmBooking(providerId) {
      const prov = providers.find(p => p.id === providerId) || providers[0];
      activeJob.providerName = prov.nameBn;
      activeJob.providerPhone = prov.phone;
      activeJob.providerAvatar = prov.avatar;
      activeJob.laborAmount = prov.baseRate;
      activeJob.urgencyFee = isUrgent ? 300 : 0;
      activeJob.paymentMethod = selectedPaymentMethod;
      activeJob.status = 'Accepted';
      activeJob.parts = [];
      activeJob.materialsAmount = 0;
      
      closeBookingModal();
      setScreen('tracking');
    }

                  <div class="flex justify-between text-slate-500 text-[11px]">
                    <span>• ${p.name}</span>
                    <span>৳ ${bnNum(p.price)}</span>

    // Modal Helpers
    function openAddPartsModal() {
      const modal = document.getElementById('parts-modal');
      if (modal) modal.classList.remove('hidden');
    }
    function closeAddPartsModal() {
      const modal = document.getElementById('parts-modal');
      if (modal) modal.classList.add('hidden');
    }
    function submitNewPart() {
      const name = document.getElementById('part-name-input').value;
      const price = parseFloat(document.getElementById('part-price-input').value) || 0;
      activeJob.parts.push({ name, qty: 1, price });
      activeJob.materialsAmount += price;
      closeAddPartsModal();
      render();
    }

    function advanceJobStatus() {
      if (activeJob.status === 'Accepted') activeJob.status = 'OnTheWay';
      else if (activeJob.status === 'OnTheWay') activeJob.status = 'Arrived';
      else if (activeJob.status === 'Arrived') activeJob.status = 'InProgress';
      else if (activeJob.status === 'InProgress') activeJob.status = 'Completed';
      render();
    }

    function simulateIncomingRequest() {
      const modal = document.getElementById('radar-modal');
      if (modal) modal.classList.remove('hidden');
    }
    function closeRadarModal() {
      const modal = document.getElementById('radar-modal');
      if (modal) modal.classList.add('hidden');
    }
    function acceptRadarJob() {
      closeRadarModal();
      activeJob.status = 'Accepted';
      render();
    }

    // Backend sync
    async function syncWithBackend() {
      try {
        const resp = await fetch('http://localhost:5242/api/v1/categories');
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data) && data.length > 0) {
            const badge = document.getElementById('api-status-badge');
            if (badge) {
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> SQL DB Live (Port 5242)';
              badge.className = 'px-2 py-0.5 text-[10px] font-semibold bg-emerald-950 text-emerald-300 border border-emerald-600 rounded-full flex items-center gap-1';
            }
          }
        }
      } catch (e) {
        console.log('Backend sync offline/fallback', e);
      }
    }

    // Bootstrap
    updateTopRoleBanner();
    render();
    syncWithBackend();
  </script>
