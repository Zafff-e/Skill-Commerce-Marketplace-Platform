name: mobile_app
description: "SkillCommerce (Dokkho Lok Khuji) - High performance on-demand service marketplace mobile client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & Real-Time Telemetry
  dio: ^5.4.0
  signalr_core: any
  uuid: ^4.3.3

  # Local Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Maps & Geospatial (OpenStreetMap, no API key needed)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI, Fonts & Localization
  google_fonts: ^6.1.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/avatars/

